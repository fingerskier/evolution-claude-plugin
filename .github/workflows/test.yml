name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Manifests are valid JSON
        run: node -e "for (const f of ['.claude-plugin/plugin.json','hooks/hooks.json','package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
